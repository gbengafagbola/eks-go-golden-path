# Deploy: test -> OIDC ECR push -> Helm upgrade on EKS.
# Requires repository variables (no long-lived AWS keys):
#   AWS_REGION, ECR_REPOSITORY, EKS_CLUSTER_NAME, APP_NAMESPACE,
#   AWS_ROLE_ECR_ARN, AWS_ROLE_DEPLOY_ARN, DEMO_BUCKET

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.23.5"
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  test:
    name: Pre-deploy checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Go
        # actions/setup-go@v5.4.0
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: app/go.sum

      - name: Test and build
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./... -count=1
          go build -o /tmp/platform-demo ./cmd/server

      - name: Setup Helm
        # azure/setup-helm@v4.3.0
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112
        with:
          version: v3.16.4

      - name: Helm lint
        working-directory: ${{ github.workspace }}
        run: |
          helm lint helm/platform-demo
          helm template platform-demo helm/platform-demo \
            --namespace platform-demo \
            --set image.repository=example.dkr.ecr.us-east-1.amazonaws.com/platform-demo \
            --set image.tag=sha-deadbeef \
            >/dev/null

  deploy:
    name: Build push and deploy
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write
    # Intentionally no GitHub Environment here: OIDC trust is branch-scoped
    # (repo:ORG/REPO:ref:refs/heads/main). If you add an environment, update
    # the IAM trust subject to repo:ORG/REPO:environment:NAME instead.
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Configure AWS credentials (ECR)
        # aws-actions/configure-aws-credentials@v4.1.0
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ECR_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-ecr-${{ github.run_id }}

      - name: Login to Amazon ECR
        # aws-actions/amazon-ecr-login@v2.0.1
        id: ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}"
          docker build -t "${IMAGE}" .
          docker push "${IMAGE}"
          DIGEST=$(aws ecr describe-images \
            --repository-name "${REPOSITORY}" \
            --image-ids imageTag="${IMAGE_TAG}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          echo "IMAGE_DIGEST=${DIGEST}" >> "$GITHUB_ENV"
          echo "Pushed ${IMAGE} digest=${DIGEST}"

      - name: Configure AWS credentials (EKS deploy)
        # aws-actions/configure-aws-credentials@v4.1.0
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722
        with:
          role-to-assume: ${{ vars.AWS_ROLE_DEPLOY_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-deploy-${{ github.run_id }}

      - name: Setup Helm
        # azure/setup-helm@v4.3.0
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112
        with:
          version: v3.16.4

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region "${{ vars.AWS_REGION }}" \
            --name "${{ vars.EKS_CLUSTER_NAME }}"

      - name: Helm upgrade
        env:
          NS: ${{ vars.APP_NAMESPACE }}
          BUCKET: ${{ vars.DEMO_BUCKET }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          REPO_URL="${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}"
          helm upgrade --install platform-demo ./helm/platform-demo \
            --namespace "${NS}" \
            --set image.repository="${REPO_URL}" \
            --set image.tag="${IMAGE_TAG}" \
            --set env.DEMO_BUCKET="${BUCKET}" \
            --set env.AWS_REGION="${REGION}" \
            --set env.OTEL_ENABLE_OTLP_EXPORT="true" \
            --wait --timeout 10m

      - name: Verify rollout and health
        env:
          NS: ${{ vars.APP_NAMESPACE }}
        run: |
          set -euo pipefail
          kubectl -n "${NS}" rollout status deploy/platform-demo --timeout=5m
          kubectl -n "${NS}" get pods,svc,hpa,networkpolicy
          kubectl -n "${NS}" port-forward svc/platform-demo 18080:80 >/tmp/pf.log 2>&1 &
          PF_PID=$!
          trap 'kill ${PF_PID} || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/readyz >/dev/null; then
              echo "readyz OK"
              curl -fsS http://127.0.0.1:18080/
              curl -fsS http://127.0.0.1:18080/metrics | head -n 20
              echo "IMAGE_DIGEST=${IMAGE_DIGEST}"
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed"
          cat /tmp/pf.log || true
          exit 1
