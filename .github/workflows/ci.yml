# CI: format, vet, test, build, image build, helm lint.
# Third-party actions are pinned to commit SHAs (upstream versions in comments).

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: "1.23.5"

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Go
        # actions/setup-go@v5.4.0
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: app/go.sum

      - name: Format check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Build
        run: go build -o /tmp/platform-demo ./cmd/server

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  container:
    name: Container build
    runs-on: ubuntu-latest
    needs: go
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Docker Buildx
        # docker/setup-buildx-action@v3.10.0
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2

      - name: Build image (no push)
        run: |
          docker build -t platform-demo:ci-${{ github.sha }} .

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.58.1

      - name: Trivy image scan
        run: |
          trivy image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed platform-demo:ci-${{ github.sha }}

  helm:
    name: Helm lint and template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Helm
        # azure/setup-helm@v4.3.0
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112
        with:
          version: v3.16.4

      - name: Lint
        run: |
          helm lint helm/platform-demo \
            --set image.repository=example.dkr.ecr.us-east-1.amazonaws.com/platform-demo \
            --set image.tag=sha-deadbeef

      - name: Template
        run: |
          helm template platform-demo helm/platform-demo \
            --namespace platform-demo \
            --set image.repository=example.dkr.ecr.us-east-1.amazonaws.com/platform-demo \
            --set image.tag=sha-deadbeef \
            --set env.DEMO_BUCKET=example-bucket \
            > /tmp/manifests.yaml
          echo "Rendered $(wc -l < /tmp/manifests.yaml) lines"
          grep -q 'kind: NetworkPolicy' /tmp/manifests.yaml
          grep -q 'kind: HorizontalPodAutoscaler' /tmp/manifests.yaml
          grep -q 'readOnlyRootFilesystem: true' /tmp/manifests.yaml
