{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "platform-demo.fullname" . }}
  namespace: {{ include "platform-demo.namespace" . }}
  labels:
    {{- include "platform-demo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "platform-demo.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only pods labeled access=allowed in this namespace (OR across from[] entries).
    # Do NOT allow all namespace traffic — that would defeat isolation tests.
    - from:
        - podSelector:
            matchLabels:
              access: allowed
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
  egress:
    # DNS to CoreDNS in kube-system
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if .Values.networkPolicy.allowAWSHTTPS }}
    # AWS API / S3 HTTPS for Pod Identity credential + S3 demos
    - ports:
        - protocol: TCP
          port: 443
    {{- end }}
{{- end }}
